# Publishes ootleRouter's two images to GitHub's container registry, which ootle/public/up.sh pulls:
#   ghcr.io/<owner>/ootlerouter       the router (the repo root's Dockerfile)
#   ghcr.io/<owner>/ootlerouter-edge  Tor, relay, gate, payments (ootle/public/Dockerfile)
# Each push to main tags both :latest and :<commit>; pin a commit tag (OR_IMAGE, OR_EDGE_IMAGE) to stay put.
name: ootle-images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ootlerouter
            file: Dockerfile
            description: "ootleRouter: agent harnesses behind a pay-per-use API in TARI"
          - name: ootlerouter-edge
            file: ootle/public/Dockerfile
            description: "ootleRouter edge: Tor, relay, gate, payments"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.description }}
