# The OotleRouterLanes template (Rust -> wasm32-unknown-unknown) and its engine tests.
#   PATH="$HOME/.cargo/bin:$PATH" cargo test
[workspace]
resolver = "2"
members = ["template", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tari_template_lib = "0.35"
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }
tari_template_test_tooling = "0.47"
tari_ootle_transaction = "0.47"
tari_ootle_common_types = "0.47"
tari_engine_types = "0.47"
tari_template_lib_types = "0.35"
# =0.24.0: tari_template_test_tooling 0.47.0 does not compile against 0.24.1.
tari_crypto = "=0.24.0"

[profile.release]
# Publishing is charged steeply by code size.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
